{{- if .Values.enabled }}
{{- $repository := required "image.repository is required" .Values.image.repository }}
{{- $digest := required "image.digest is required" .Values.image.digest }}
{{- $identity := required "identity.existingConfigMap is required" .Values.identity.existingConfigMap }}
{{- $policy := required "policy.existingConfigMap is required" .Values.policy.existingConfigMap }}
{{- $store := required "ownedStore.existingSecret is required" .Values.ownedStore.existingSecret }}
{{- $endpoints := required "endpointGrants.existingConfigMap is required" .Values.endpointGrants.existingConfigMap }}
{{- $credentials := required "credentialReferences.existingSecret is required" .Values.credentialReferences.existingSecret }}
{{- $staging := required "staging.existingConfigMap is required" .Values.staging.existingConfigMap }}
{{- $sourcePolicy := required "sourceNetworkPolicy.existingConfigMap is required" .Values.sourceNetworkPolicy.existingConfigMap }}
{{- $domains := required "domainBindings.existingConfigMap is required" .Values.domainBindings.existingConfigMap }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default "planeon-connector-controller" .Values.serviceAccount.name }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planeon-connector-controller
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: planeon-connector-controller}
  template:
    metadata:
      labels: {app.kubernetes.io/name: planeon-connector-controller}
    spec:
      serviceAccountName: {{ default "planeon-connector-controller" .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: service
          image: "{{ $repository }}@{{ $digest }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          envFrom:
            - configMapRef: {name: "{{ $identity }}"}
            - configMapRef: {name: "{{ $policy }}"}
            - secretRef: {name: "{{ $store }}"}
            - configMapRef: {name: "{{ $endpoints }}"}
            - secretRef: {name: "{{ $credentials }}"}
            - configMapRef: {name: "{{ $staging }}"}
            - configMapRef: {name: "{{ $sourcePolicy }}"}
            - configMapRef: {name: "{{ $domains }}"}
          ports: [{name: health, containerPort: 8080, protocol: TCP}]
          livenessProbe: {httpGet: {path: /health/live, port: health}}
          readinessProbe: {httpGet: {path: /health/ready, port: health}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 16Mi}}]
{{- end }}
