{{- if .Values.enabled }}
{{- $repository := required "image.repository is required" .Values.image.repository }}
{{- $digest := required "image.digest is required" .Values.image.digest }}
{{- $identity := required "identity.existingConfigMap is required" .Values.identity.existingConfigMap }}
{{- $policy := required "policy.existingConfigMap is required" .Values.policy.existingConfigMap }}
{{- $store := required "ownedStore.existingSecret is required" .Values.ownedStore.existingSecret }}
{{- $semantic := required "semanticProvider.existingConfigMap is required" .Values.semanticProvider.existingConfigMap }}
{{- $semanticDigest := required "semanticProvider.bundleDigest is required" .Values.semanticProvider.bundleDigest }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default "planeon-domain-service" .Values.serviceAccount.name }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planeon-domain-service
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: planeon-domain-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: planeon-domain-service}
    spec:
      serviceAccountName: {{ default "planeon-domain-service" .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: service
          image: "{{ $repository }}@{{ $digest }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          envFrom:
            - configMapRef: {name: "{{ $identity }}"}
            - configMapRef: {name: "{{ $policy }}"}
            - secretRef: {name: "{{ $store }}"}
            - configMapRef: {name: "{{ $semantic }}"}
          env:
            - name: PLANEON_SEMANTIC_BUNDLE_DIGEST
              value: "{{ $semanticDigest }}"
          ports: [{name: health, containerPort: 8080, protocol: TCP}]
          livenessProbe: {httpGet: {path: /health/live, port: health}}
          readinessProbe: {httpGet: {path: /health/ready, port: health}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 16Mi}}]
{{- end }}
